name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint, shellcheck, prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      PRETTIER_VERSION: 3.8.3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        run: git ls-files '*.sh' | xargs -r shellcheck

      - name: Run actionlint
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color

      - name: Prettier
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check .

  test:
    name: action tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run detect-changed-paths tests
        run: bash detect-changed-paths/tests/run.sh

      - name: Run sync-cloudflare-secrets tests
        run: bash sync-cloudflare-secrets/tests/run.sh
